<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ویرایش خدمت
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background: #f5f5f5;

            color: #222;
        }


        .container {
            width: 100%;

            max-width: 700px;

            margin: 0 auto;

            padding: 25px 20px;
        }


        .header {
            margin-bottom: 25px;
        }


        .header h1 {
            margin: 0 0 8px;

            font-size: 24px;
        }


        .header p {
            margin: 0;

            color: #777;

            font-size: 14px;
        }


        .form-card {
            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.06);
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: bold;
        }


        .form-group input {
            width: 100%;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 13px 14px;

            font-family: inherit;

            font-size: 15px;

            outline: none;
        }


        .form-group input:focus {
            border-color: #222;
        }


        .help-text {
            margin-top: 7px;

            color: #888;

            font-size: 12px;
        }


        .checkbox-group {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;
        }


        .checkbox-group input {
            width: 18px;

            height: 18px;

            cursor: pointer;
        }


        .checkbox-group label {
            margin: 0;

            font-size: 14px;

            cursor: pointer;
        }


        .error-message {
            background: #fff1f0;

            color: #b42318;

            border-radius: 10px;

            padding: 13px;

            margin-bottom: 20px;

            font-size: 14px;

            line-height: 1.7;
        }


        .buttons {
            display: flex;

            gap: 10px;
        }


        .button {
            flex: 1;

            border: none;

            border-radius: 11px;

            padding: 14px;

            font-family: inherit;

            font-size: 15px;

            text-align: center;

            text-decoration: none;

            cursor: pointer;
        }


        .save-button {
            background: #222;

            color: white;
        }


        .save-button:hover {
            background: #000;
        }


        .cancel-button {
            background: #eee;

            color: #333;
        }


        .cancel-button:hover {
            background: #e2e2e2;
        }


        @media (max-width: 600px) {

            .container {
                padding: 18px 15px;
            }


            .header h1 {
                font-size: 21px;
            }


            .form-card {
                padding: 20px;
            }


            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>
            ویرایش خدمت
        </h1>

        <p>
            {{ business.name }}
        </p>

    </div>


    <div class="form-card">


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}



        <form
            method="post"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    نام خدمت
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ service.name }}"
                    required
                >

            </div>



            <div class="form-group">

                <label for="duration">
                    مدت زمان
                </label>

                <input
                    type="number"
                    id="duration"
                    name="duration"
                    value="{{ service.duration }}"
                    min="1"
                    required
                >

                <div class="help-text">
                    مدت زمان را بر حسب دقیقه وارد کنید.
                </div>

            </div>



            <div class="form-group">

                <label for="price">
                    قیمت
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ service.price|default_if_none:'' }}"
                    min="0"
                >

                <div class="help-text">
                    در صورت نداشتن قیمت، این قسمت را خالی بگذارید.
                </div>

            </div>



            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="is_active"
                    name="is_active"
                    {% if service.is_active %}checked{% endif %}
                >

                <label for="is_active">
                    این خدمت فعال باشد
                </label>

            </div>



            <div class="buttons">

                <button
                    type="submit"
                    class="button save-button"
                >
                    ذخیره تغییرات
                </button>


                <a
                    href="{% url 'owner_services' %}"
                    class="button cancel-button"
                >
                    انصراف
                </a>

            </div>


        </form>


    </div>


</div>


</body>

</html>
